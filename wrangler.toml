name = "plan-that-party"
main = "src/index.js"
compatibility_date = "2025-01-15"

# Static front-end (plain HTML/CSS/JS — no build step) is served from ./public.
# The Worker handles /api/* and lets everything else fall through to assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 (SQLite) database. After `wrangler d1 create plan-that-party`,
# paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "plan-that-party"
database_id = "PASTE_DATABASE_ID_HERE"
