name = "plan-that-party"
main = "src/index.js"
compatibility_date = "2025-01-15"

# Static front-end (plain HTML/CSS/JS — no build step) is served from ./public.
# The Worker handles /api/* and lets everything else fall through to assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 (SQLite) database — already provisioned on your Cloudflare account
# and seeded with the starter template.
[[d1_databases]]
binding = "DB"
database_name = "plan-that-party"
database_id = "cb5dcec1-9acf-4451-8554-a21c7ac947ce"
